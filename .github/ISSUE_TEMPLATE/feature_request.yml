name: Feature Request
description: Suggest an improvement or new feature.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Discord bot
        - Verification website
        - Dashboard
        - Verification/security engine
        - Database
        - Developer experience
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways this could be implemented?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
