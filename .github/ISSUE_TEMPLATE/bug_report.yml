name: Bug Report
description: Report something that is not working correctly.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not include tokens, credentials, database URLs, API keys, or other secrets.

        Security vulnerabilities should be reported privately according to SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Discord bot
        - Verification website
        - Database
        - Security package
        - Shared package
        - Development tooling
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Version, branch, or commit SHA if known.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove all secrets and personal information before posting logs.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I have removed secrets and credentials from this report.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
