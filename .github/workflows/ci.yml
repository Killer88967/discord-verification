name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Build, Typecheck & Lint
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "prisma+postgres://localhost:51213/?api__c3NsbW9kZT1kaXNhYmxlJmNvbm5lY3Rpb25fbGltaXQ9MTAmY29ubmVjdF90aW1lb3V0PTAmbWF4X2lkbGVfY29ubmVjdGlvbl9saWZldGltZT0wJnBvb2xfdGltZW91dD0wJnNvY2tldF90aW1lb3V0PTAifQ"

      DISCORD_TOKEN: "ci-placeholder"
      DISCORD_CLIENT_ID: "ci-placeholder"
      VERIFY_URL: "http://localhost:3000"

      AUTH_SECRET: "ci-placeholder"
      AUTH_DISCORD_ID: "ci-placeholder"
      AUTH_DISCORD_SECRET: "ci-placeholder"

      DISCORD_DEV_GUILD_ID: "ci-placeholder"

      INTERNAL_API_SECRET: "ci-placeholder"
      INTERNAL_API_PORT: "3100"

      BOT_INTERNAL_URL: "http://127.0.0.1:3100"
      FINGERPRINT_HMAC_SECRET: "ci-placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Prisma Postgres
        run: pnpm --filter @verification/database exec prisma dev --detach

      - name: Generate Prisma client
        run: pnpm db:gen

      - name: Build internal packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint web app
        run: pnpm --filter @verification/web lint

      - name: Build
        run: pnpm build
